<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Campaign Character Sheets</title>
<style>
  :root{
    --bg:#1b1712; --panel:#242019; --panel-2:#2c2620; --border:#463c2e;
    --text:#ece3d2; --text-dim:#b7a98d; --accent:#c9762c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding:20px 16px 60px;max-width:520px;margin:0 auto;}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:0.85rem;margin-bottom:20px;}
  .char-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .char-card{display:block;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--text);}
  .char-card:active{background:var(--panel-2);}
  .char-card-name{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;font-weight:700;}
  .char-card-sub{color:var(--text-dim);font-size:0.85rem;margin-top:2px;}
  .footer-note{text-align:center;color:var(--text-dim);font-size:0.75rem;margin-top:24px;}
  .dm-link{display:block;text-align:center;color:var(--text-dim);font-size:0.72rem;
    text-decoration:none;margin-top:10px;}

  @media (min-width:820px){
    body{max-width:1100px;padding:40px 32px 60px;}
    h1{font-size:2.1rem;}
    .char-grid{grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:14px;}
    .char-card{padding:18px 20px;transition:border-color .15s, transform .15s;}
    .char-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  }
</style>
</head>
<body>
  <h1>Campaign Character Sheets</h1>
  <div class="sub">Pick your character to play.</div>
  <div class="char-grid" id="chars">
__CHAR_CARDS__
  </div>
  <div class="footer-note">Each sheet saves HP, spell slot use, conditions, journal and notes on your own device — nothing is shared between players.</div>
  <a class="dm-link" href="dm.html">DM login</a>
</body>
</html>
