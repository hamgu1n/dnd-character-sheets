<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Campaign Character Sheets</title>
<style>
  :root{
    --bg:#1b1712; --panel:#242019; --panel-2:#2c2620; --border:#463c2e;
    --text:#ece3d2; --text-dim:#b7a98d; --accent:#c9762c;
  }
  [data-theme="slate"]{
    --bg:#16181d; --panel:#1e2128; --panel-2:#262a33; --border:#343a46;
    --text:#e8eaed; --text-dim:#9aa3af; --accent:#5b8def;
  }
  [data-theme="indigo"]{
    --bg:#14121f; --panel:#1d1a2e; --panel-2:#241f3d; --border:#372f56;
    --text:#e6e2f5; --text-dim:#a99cc9; --accent:#8b6cf2;
  }
  [data-theme="emerald"]{
    --bg:#121815; --panel:#1a2320; --panel-2:#20302a; --border:#324a3d;
    --text:#e5ede9; --text-dim:#9bb5a8; --accent:#4fae7a;
  }
  .theme-picker{position:fixed;top:8px;right:8px;z-index:80;}
  .theme-picker-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:50%;width:32px;height:32px;font-size:0.95rem;cursor:pointer;line-height:1;}
  .theme-menu{position:absolute;top:38px;right:0;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:130px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .theme-menu button{background:none;border:none;color:var(--text);text-align:left;padding:7px 9px;
    border-radius:6px;font-size:0.82rem;font-family:inherit;cursor:pointer;width:100%;}
  .theme-menu button:hover{background:var(--panel-2);}
  .theme-menu button.active{font-weight:700;color:var(--accent);}
  [hidden]{display:none !important;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding:20px 16px 60px;max-width:520px;margin:0 auto;}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:0.85rem;margin-bottom:20px;}
  .char-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .char-card{display:block;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--text);}
  .char-card:active{background:var(--panel-2);}
  .char-card-name{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;font-weight:700;}
  .char-card-sub{color:var(--text-dim);font-size:0.85rem;margin-top:2px;}
  .footer-note{text-align:center;color:var(--text-dim);font-size:0.75rem;margin-top:24px;}
  .dm-link{display:block;text-align:center;color:var(--text-dim);font-size:0.72rem;
    text-decoration:none;margin-top:10px;}

  @media (min-width:820px){
    body{max-width:1100px;padding:40px 32px 60px;}
    h1{font-size:2.1rem;}
    .char-grid{grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:14px;}
    .char-card{padding:18px 20px;transition:border-color .15s, transform .15s;}
    .char-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  }
</style>
<script>
(function(){
  try{
    const t = localStorage.getItem("dnd-theme") || "slate";
    if(t !== "classic") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>
<body>
  <div class="theme-picker" id="themePicker">
    <button class="theme-picker-btn" onclick="toggleThemeMenu()" title="Theme" aria-label="Change theme">🎨</button>
    <div class="theme-menu" id="themeMenu" hidden>
      <button data-theme-opt="slate" onclick="setTheme('slate')">Slate</button>
      <button data-theme-opt="indigo" onclick="setTheme('indigo')">Indigo</button>
      <button data-theme-opt="emerald" onclick="setTheme('emerald')">Emerald</button>
      <button data-theme-opt="classic" onclick="setTheme('classic')">Classic (brown)</button>
    </div>
  </div>
  <h1>Campaign Character Sheets</h1>
  <div class="sub">Pick your character to play.</div>
  <div class="char-grid" id="chars">
__CHAR_CARDS__
  </div>
  <div class="footer-note">Sheet edits are DM-only and sync live for everyone. HP, spell slot use, conditions, journal and notes sync live too, from whatever device you're using.</div>
  <a class="dm-link" href="dm.html">DM login</a>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// The cards above render instantly from what was baked in at the last
// rebuild; this keeps names/subtitles live afterward (e.g. a DM renaming a
// character) without needing a rebuild + push for that to show up here.
const firebaseConfig = {
  apiKey: "AIzaSyBKwdUomjwLubIzcZTRXAJNqiiiUbzPAoQ",
  authDomain: "dnd-character-sheets-87c23.firebaseapp.com",
  projectId: "dnd-character-sheets-87c23",
  storageBucket: "dnd-character-sheets-87c23.firebasestorage.app",
  messagingSenderId: "787644284719",
  appId: "1:787644284719:web:9b93eb9f189b9090f4ebda",
};
firebase.initializeApp(firebaseConfig);
function cardSub(data){
  const cls = (data.classes && data.classes[0]) || {};
  const parts = [data.species, cls.name, cls.level].filter(Boolean);
  let sub = parts.join(" ");
  if(cls.subclass) sub += " &middot; " + cls.subclass;
  return sub;
}
firebase.firestore().collection("characters").onSnapshot(snap => {
  snap.forEach(doc => {
    const card = document.querySelector('.char-card[data-char-id="' + doc.id + '"]');
    if(!card) return; // a brand-new character still needs a rebuild for its own page/slug to exist
    const data = doc.data();
    card.querySelector(".char-card-name").textContent = data.name;
    card.querySelector(".char-card-sub").innerHTML = cardSub(data);
  });
});
</script>
<script>
function setTheme(name){
  try{ localStorage.setItem("dnd-theme", name); }catch(e){}
  if(name === "classic") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", name);
  document.getElementById("themeMenu").hidden = true;
  updateThemeMenuActive();
}
function toggleThemeMenu(){
  const menu = document.getElementById("themeMenu");
  menu.hidden = !menu.hidden;
  updateThemeMenuActive();
}
function updateThemeMenuActive(){
  let current = "slate";
  try{ current = localStorage.getItem("dnd-theme") || "slate"; }catch(e){}
  document.querySelectorAll("#themeMenu button").forEach(b => {
    b.classList.toggle("active", b.dataset.themeOpt === current);
  });
}
document.addEventListener("click", (e) => {
  const picker = document.getElementById("themePicker");
  if(picker && !picker.contains(e.target)) document.getElementById("themeMenu").hidden = true;
});
updateThemeMenuActive();
</script>
</body>
</html>
